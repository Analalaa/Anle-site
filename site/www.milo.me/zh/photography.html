<script>
(function(){
  var state='grid';

  function applyView(){
    var grid=document.querySelector('.photo-grid');
    if(!grid)return;
    grid.classList.remove('grid-mode','original-mode');
    grid.classList.add(state==='grid'?'grid-mode':'original-mode');
    var bg=document.getElementById('btnGrid');
    var bo=document.getElementById('btnOriginal');
    if(bg)bg.classList.toggle('active',state==='grid');
    if(bo)bo.classList.toggle('active',state==='original');
  }

  function setup(){
    var grid=document.querySelector('.photo-grid');
    if(!grid||document.getElementById('viewToggle'))return;
    var toggle=document.createElement('div');
    toggle.id='viewToggle';
    toggle.className='view-toggle';
    toggle.innerHTML='<button id="btnGrid" class="active" title="网格视图"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button><button id="btnOriginal" title="原尺寸视图"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>';
    grid.parentElement.insertBefore(toggle,grid);
    document.getElementById('btnGrid').addEventListener('click',function(){state='grid';applyView()});
    document.getElementById('btnOriginal').addEventListener('click',function(){state='original';applyView()});
    applyView();
  }

  var lb=document.getElementById('lightbox');
  lb.addEventListener('click',function(){lb.style.display='none';lb.style.opacity='0'});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.style.display='none';lb.style.opacity='0'}});

  document.addEventListener('click',function(e){
    var img=e.target.closest('.photo-grid .ph-img');
    if(!img)return;
    var src=img.src;
    var lbImg=document.getElementById('lightboxImg');
    lbImg.src=src;
    lbImg.alt=img.alt;
    lb.style.display='flex';
    requestAnimationFrame(function(){lb.style.opacity='1'});
  });

  setup();

  // Theme toggle
  var moon='<svg viewBox="0 0 24 24"><path d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"/></svg>';
  var sun='<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/></svg>';
  var btn=document.createElement('button');
  btn.className='theme-toggle-btn';
  btn.setAttribute('aria-label','Toggle Dark Mode');
  btn.innerHTML='<span class="sun-icon">'+sun+'</span><span class="moon-icon">'+moon+'</span>';
  btn.onclick=function(){
    var isDark=document.documentElement.classList.contains('dark');
    var next=isDark?'light':'dark';
    document.documentElement.classList.remove('light','dark');
    document.documentElement.classList.add(next);
    document.documentElement.style.colorScheme=next;
    localStorage.setItem('theme',next);
  };
  var navContainers=document.querySelectorAll('.inline-flex.gap-4.items-center, .inline-flex.items-center.gap-3');
  navContainers.forEach(function(c){c.appendChild(btn.cloneNode(true))});
  document.querySelectorAll('.theme-toggle-btn').forEach(function(b){
    b.onclick=btn.onclick;
  });

  // Fade-in animation
  var fadeObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var d=e.target.getAttribute('data-delay')||0;
        if(d){e.target.style.transitionDelay=d+'ms'}
        e.target.classList.add('is-visible');
        fadeObserver.unobserve(e.target);
      }
    });
  },{threshold:0.1});
  document.querySelectorAll('.fade-in-section').forEach(function(el){fadeObserver.observe(el)});

  // Infinite scroll
  var batchSize=12;
  var allPhotos=document.querySelectorAll('.photo-grid .group');
  var loaded=batchSize;
  for(var i=batchSize;i<allPhotos.length;i++){
    allPhotos[i].classList.add('hidden-photo');
  }
  if(loaded>=allPhotos.length){
    document.getElementById('scrollSentinel').style.display='none';
  }
  var observer=new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting&&loaded<allPhotos.length){
      document.getElementById('scrollLoading').style.display='flex';
      setTimeout(function(){
        var end=Math.min(loaded+batchSize,allPhotos.length);
        for(var i=loaded;i<end;i++){
          allPhotos[i].classList.remove('hidden-photo');
        }
        loaded=end;
        document.getElementById('scrollLoading').style.display='none';
        if(loaded>=allPhotos.length){
          document.getElementById('scrollSentinel').style.display='none';
          observer.disconnect();
        }
      },300);
    }
  },{rootMargin:'200px'});
  observer.observe(document.getElementById('scrollSentinel'));
